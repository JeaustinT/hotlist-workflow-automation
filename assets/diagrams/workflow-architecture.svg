<text x="40" y="54" class="title" fill="#17324D" text-anchor="start">A repeatable workflow with a shared working queue</text>
<text x="40" y="88" class="sub" fill="#526779" text-anchor="start">Configuration and history inform preparation; analysts work directly in Assigned Work.</text>
