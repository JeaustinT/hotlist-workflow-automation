<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1160" viewBox="0 0 1360 1160" role="img" aria-labelledby="title desc">
<title id="title">Hotlist Workflow Automation architecture</title><desc id="desc">Input passes through validation, classification, historical lookup, grouping and allocation. The assigned queue supports summary, progress, Outlook drafts and history export.</desc>
