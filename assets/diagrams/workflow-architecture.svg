<text x="40" y="1095" class="sub" fill="#17324D" text-anchor="start">Excel/VBA handles the desktop workflow; Outlook opens a draft for human review.</text>
<text x="40" y="1126" class="small" fill="#526779" text-anchor="start">Python tooling builds and validates the synthetic demo. It is not part of operational invoice preparation.</text>
