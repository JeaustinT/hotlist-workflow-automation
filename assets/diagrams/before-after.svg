<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc">
<title id="title">Hotlist preparation: before and after</title><desc id="desc">The spreadsheet-supported baseline required manual coordination. Automated preparation produces an assigned queue. Timings are owner-reported and exclude invoice processing.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526779"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:32px;font-weight:700} .sub{font-size:18px} .label{font-size:19px;font-weight:700} .body{font-size:17px} .small{font-size:15px}</style>
<text x="40" y="56" class="title" fill="#17324D" text-anchor="start">From incoming report to assigned work</text>
<text x="40" y="92" class="sub" fill="#526779" text-anchor="start">Process redesign reduces manual preparation before analysts begin processing invoices.</text>
